<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sitemap XML - docsify-ogas2.0</title>
</head>
<body>
  <h1>Generated Sitemap.xml</h1>
  <pre id="sitemap" style="white-space: pre-wrap; background: #f9f9f9; padding: 1em; border: 1px solid #ccc;"></pre>

  <script>
    const owner = 'thirstywaterx';
    const repo = 'docsify-ogas2.0';
    const branch = 'develop';

    async function getRepoTree() {
      const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
      const res = await fetch(apiUrl);
      const data = await res.json();
      return data.tree.filter(item => item.path.endsWith('.md'));
    }

    function buildSitemap(mdFiles) {
      const baseUrl = location.origin + location.pathname.replace(/sitemap\.html$/, '');
      let sitemapXml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      sitemapXml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n`;

      mdFiles.forEach(file => {
        const fileUrl = `${baseUrl}${file.path}`;
        sitemapXml += `  <url>\n    <loc>${fileUrl}</loc>\n  </url>\n`;
      });

      sitemapXml += `</urlset>`;
      return sitemapXml;
    }

    getRepoTree().then(mdFiles => {
      const xml = buildSitemap(mdFiles);
      document.getElementById('sitemap').textContent = xml;
    });
  </script>
</body>
</html>
